# Behavioural configuration for the WRC pipeline.
#
# Rule of thumb for what lives where:
#   .env                 -> things that differ per environment, and secrets
#                           (connection strings, credentials, ports)
#   config/settings.yaml -> things that are properties of the *pipeline*
#                           (partition size, bucket names, selectors, body IDs)
#
# Nothing in this file is a secret, which is why it is committed. Together with
# .env it satisfies the exercise requirement that all connection strings,
# storage paths, partition sizes and scraping parameters be configurable, with
# no hardcoded values in the code.
#
# src/wrc_pipeline/config.py (Step 2) merges this file with the environment
# into a single settings object.

source:
  name: workplace_relations
  base_url: "https://www.workplacerelations.ie"
  search_path: "/en/search/"

  # The site's date filter uses Irish convention d/M/yyyy with NO leading
  # zeros (1/10/2025, not 01/10/2025). Supplying zero-padded dates returns an
  # empty result set *silently* rather than erroring, so this is load-bearing
  # and must not be "tidied up".
  #
  # Deliberately a str.format template rather than a strftime pattern. The
  # strftime way to strip leading zeros is "%-d/%-m/%Y", but "%-d" is a glibc
  # extension: it works on Linux and macOS and raises ValueError on Windows.
  # Substituting the integers day/month/year drops the leading zeros
  # structurally - 1 formats as "1", never "01" - so the behaviour the site
  # depends on is a property of the data type rather than of a fragile
  # platform-specific directive. See SourceSettings.format_date in config.py.
  date_format: "{day}/{month}/{year}"

  # The results list is fixed at 10 per page by the site. Used to turn the
  # "Shows 11 to 20 of 2417 results" counter into a page count.
  results_per_page: 10

  # Parts of a response that change on every request and are not part of the
  # document. Removed before the bytes are hashed or stored - see
  # scraper/normalise.py.
  #
  # Two of them, both in a trailing HTML comment, found by fetching the same
  # pages repeatedly and diffing:
  #
  #   <!-- Elapsed time: 0.0311889 -->
  #       The server's own render time. Different on literally every request.
  #
  #   <!-- cached or not being index.aspx page -->
  #       Present only when the response came from the server's cache, so it
  #       appears and disappears depending on traffic rather than on content.
  #
  # Without stripping these, two fetches of an unchanged page hash differently,
  # nothing is ever recognised as unchanged, and every run re-downloads and
  # re-writes the whole corpus while reporting success. Found in Step 6 by
  # running the same partition twice and getting 36 rewrites out of 45.
  #
  # Regular expressions, applied to the raw bytes. Being per-source
  # configuration rather than code is most of the answer to "what would you
  # change to support 50+ sources".
  volatile_patterns:
    - "<!-- Elapsed time: [0-9.]+ -->"
    - "<!-- cached or not being index\\.aspx page -->"

  # Where the decision itself lives on a detail page, most specific first.
  #
  # `div.col-sm-9` is the column holding the identifier heading, the document
  # title and the decision body - exactly the region the exercise's own
  # screenshot boxes as "relevant content". Measured against the captured
  # fixtures: it keeps 89% of an ADJ page and 82% of a Labour Court page, and
  # leaks none of the furniture (language switcher, WRC/Labour Court banner,
  # the site blurb, "Return to Search", cookie notice, sitemap).
  #
  # Selecting the container is deliberate, rather than deleting nav/header/
  # footer one tag at a time. Stripping a blocklist only removes the furniture
  # you thought of; selecting the container keeps only what you meant, and a
  # new widget appearing in the page template does not silently end up in the
  # curated corpus.
  #
  # `div.content` is the fallback: it is the body without the identifier
  # heading, so it still yields a usable document if the outer column changes.
  content_selectors:
    - "div.col-sm-9"
    - "div.content"

# The four bodies in the site's left-hand "Body" filter, with the numeric IDs
# its search endpoint expects. Confirmed individually against the live site.
# The WRC's ID is an outlier because the WRC was created in 2015 and absorbed
# the other three bodies, so it was added to their CMS later.
bodies:
  equality_tribunal: 1
  employment_appeals_tribunal: 2
  labour_court: 3
  workplace_relations_commission: 15376

partitioning:
  # Monthly is the default; justified in ARCHITECTURE.md. Configurable because
  # the right size is a property of the source's record density, not of the
  # pipeline. Supported values: daily | weekly | monthly | quarterly | yearly.
  size: monthly

# Landing -> Curated transformation.
transform:
  # Tags removed from the extracted container. Not content, and `script` in
  # particular would otherwise put analytics code into a legal corpus.
  strip_tags:
    - script
    - style
    - noscript

  # A cleaned HTML document shorter than this is flagged in the logs and on the
  # curated record. Not an error - some determinations genuinely are short, and
  # a PDF stub page has almost no inline text at all - but a sudden crop of them
  # is the signature of a changed page template, which is exactly the failure
  # that would otherwise go unnoticed until someone read the data.
  min_content_chars: 200

storage:
  mongo:
    database: wrc
    # Landing Zone is immutable per the exercise brief - the transform job
    # writes to a separate collection, it never mutates this one.
    landing_collection: landing_decisions
    curated_collection: curated_decisions
    # Mutable latest-record index, separate from immutable capture snapshots.
    # null derives <landing_collection>_state; set a name to override it.
    state_collection: null
  object_store:
    landing_bucket: wrc-landing
    curated_bucket: wrc-curated

# Scrapy tuning. These numbers were measured, not guessed - see
# scripts/tune_throughput.py, which re-runs the sweep below on demand.
#
# The exercise asks for "the fastest way to scrape the URLs without getting
# blocked". Both halves are empirical questions about one specific server, so
# the same workload (Labour Court, February 2024 - 73 requests) was run under
# four AutoThrottle profiles, twice each:
#
#   target concurrency   elapsed (avg)   req/min   non-200   retries
#   ------------------   -------------   -------   -------   -------
#   1                        52.2s           84       0         0
#   2                        27.8s          158       0         0     <- chosen
#   4                        27.9s          157       0         0
#   8                        22.9s          191       0         0
#
# Two things the data says. Between 2 and 4 there is no difference at all -
# that is the plateau, and above it the ceiling is the server rather than the
# setting. Going all the way to 8 does buy about 20%, and the site showed no
# distress at any level: zero non-200 responses and zero retries throughout.
#
# Target concurrency 2 is chosen anyway. Across the exercise's stated
# evaluation size (500-1000 documents, ~985 requests) the difference between
# this setting and the fastest measured one is roughly one minute of wall
# clock - which is not worth four times the concurrent load on a small public
# government service that has never asked us to back off. The politeness is a
# deliberate choice made against known numbers, not a substitute for measuring.
#
# AutoThrottle remains the control rather than download_delay: it watches the
# latency the server actually returns and backs off on its own when the site is
# busy, which a fixed sleep cannot do. download_delay is a floor beneath it and
# concurrent_requests_per_domain a hard ceiling above it.
scraping:
  autothrottle_enabled: true
  autothrottle_start_delay: 1.0
  autothrottle_max_delay: 30.0
  autothrottle_target_concurrency: 2.0
  download_delay: 0.25
  concurrent_requests: 8
  concurrent_requests_per_domain: 4
  download_timeout: 60
  retry_times: 3
  retry_http_codes: [429, 500, 502, 503, 504, 522, 524, 408]
  # Honest identification with a contact route, rather than pretending to be a
  # browser. Appropriate for a public government publication database.
  user_agent: "wrc-pipeline/0.1 (+coding exercise; contact: candidate@example.com)"
  # Cache responses on disk during development so that re-running a partition
  # while debugging costs the site nothing. Disabled by default so a real run
  # never serves stale data.
  httpcache_enabled: false
  httpcache_expiration_secs: 86400
